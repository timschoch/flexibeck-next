# The PR gate. One job running the ci stage of .skilly/verify.json.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited] # edited: the pr workflow step reads the PR body
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the changed-files steps diff against the base
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: pnpm install --frozen-lockfile
      - if: hashFiles('playwright.config.*') != ''
        run: pnpm exec playwright install --with-deps chromium
      - run: node .agents/skills/verify/scripts/verify.mjs ci
        env:
          GLUE_API_URL: ${{ secrets.GLUE_API_URL }} # the PR gate checks Decision ids against Glue
          GLUE_API_TOKEN: ${{ secrets.GLUE_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }} # Neon branch `ci` of project flexibeck, for e2e smoke
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
